name: One-off Degu 0.2.5 Download
on:
  push:
    branches: [chat-delivery-degu-025]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm release ZIP structure
        run: |
          test -s release/SirRosa-SirrohDegu-0.2.5.zip
          unzip -t release/SirRosa-SirrohDegu-0.2.5.zip
      - uses: actions/upload-artifact@v4
        with:
          name: degu025-direct
          path: release/SirRosa-SirrohDegu-0.2.5.zip
          retention-days: 1
          if-no-files-found: error
