name: Build Sirroh Degu
on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate and unpack exact Degu mesh asset
        run: python3 tools/unpack_model.py
      - name: Rebuild and audit Degu skin from original FaceSets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet numpy
          python3 tools/rebuild_skin.py
          test -s release/Degu_Skinning_QA.json
      - name: Install SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1
      - name: Download Valheim Dedicated Server for game assemblies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valheim"
          for attempt in 1 2 3; do
            if steamcmd +force_install_dir "$RUNNER_TEMP/valheim" +login anonymous +app_update 896660 -beta public validate +quit && test -s "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"; then break; fi
            sleep 6
          done
          test -s "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Download BepInEx compile references
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2351/' -o /tmp/bepinex.zip
          mkdir -p /tmp/bepinex .ci-deps
          unzip -q /tmp/bepinex.zip -d /tmp/bepinex
          cp "$(find /tmp/bepinex -type f -name BepInEx.dll -print -quit)" .ci-deps/BepInEx.dll
          cp "$(find /tmp/bepinex -type f -name 0Harmony.dll -print -quit)" .ci-deps/0Harmony.dll
          for f in assembly_valheim.dll assembly_utils.dll UnityEngine.CoreModule.dll UnityEngine.AnimationModule.dll UnityEngine.dll; do
            cp "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/$f" ".ci-deps/$f"
          done
      - name: Compile BepInEx plugin net48
        run: dotnet build SirrohDegu.csproj -c Release --nologo -v minimal
      - name: Download Blender for native rig and deformation verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 30 'https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz' -o /tmp/degu-blender.tar.xz
          mkdir -p /tmp/degu-blender
          tar -xJf /tmp/degu-blender.tar.xz -C /tmp/degu-blender
          echo "BLENDER_BIN=$(find /tmp/degu-blender -type f -name blender | head -n1)" >> "$GITHUB_ENV"
      - name: Generate reviewable Blender model and verify physical deformation
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --python-exit-code 2 --python tools/build_blend.py > release/Degu_Blender_Build.log 2>&1 || { tail -n 100 release/Degu_Blender_Build.log; exit 1; }
          grep -q DEGU_BLENDER_QA_PASS release/Degu_Blender_Build.log
          test -s release/Degu_Wolf_Reweighted_v0.1.4.blend
          test -s release/Degu_Blender_QA.json
          tail -n 8 release/Degu_Blender_Build.log
      - name: Install icon rendering library
        run: python3 -m pip install --quiet Pillow
      - name: Package and run static validation
        shell: bash
        run: |
          set -euo pipefail
          test -s bin/Release/net48/SirrohDegu.dll
          mkdir -p release/SirrohDegu
          cp bin/Release/net48/SirrohDegu.dll release/SirrohDegu/SirrohDegu.dll
          cp manifest.json release/SirrohDegu/manifest.json
          cp README.md release/SirrohDegu/README.md
          python3 tools/verify_build.py release/SirrohDegu/SirrohDegu.dll
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version_number"])')
          (cd release && zip -qr "SirrohDegu-${VERSION}.zip" SirrohDegu)
          python3 tools/package_thunderstore.py \
            --dll release/SirrohDegu/SirrohDegu.dll \
            --manifest manifest.json --readme README.md \
            --icon release/SirrohDegu/icon.png \
            --out "release/SirRosa-SirrohDegu-${VERSION}.zip"
          unzip -Z1 "release/SirRosa-SirrohDegu-${VERSION}.zip"
      - name: Commit tested release DLL and ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version_number"])')
          git add -f "release/SirrohDegu-${VERSION}.zip" "release/SirRosa-SirrohDegu-${VERSION}.zip" \
            release/SirrohDegu/SirrohDegu.dll release/SirrohDegu/manifest.json \
            release/SirrohDegu/README.md release/SirrohDegu/icon.png \
            release/Degu_Wolf_Reweighted_v0.1.4.blend release/Degu_Blender_QA.json \
            release/Degu_Skinning_QA.json release/Degu_Blender_Build.log
          if ! git diff --cached --quiet; then
            git commit -m "Release tested Sirroh Degu Thunderstore ZIP v${VERSION}"
            git push origin HEAD:main
          fi
