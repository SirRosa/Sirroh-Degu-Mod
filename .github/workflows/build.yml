name: Build Sirroh Degu 0.1.0
on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate and unpack exact Degu mesh asset
        run: python3 tools/unpack_model.py
      - name: Install SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1
      - name: Download Valheim Dedicated Server for game assemblies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valheim"
          for attempt in 1 2 3; do
            if steamcmd +force_install_dir "$RUNNER_TEMP/valheim" +login anonymous +app_update 896660 -beta public validate +quit && test -s "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"; then break; fi
            sleep 6
          done
          test -s "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Download BepInEx compile references
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2351/' -o /tmp/bepinex.zip
          mkdir -p /tmp/bepinex .ci-deps
          unzip -q /tmp/bepinex.zip -d /tmp/bepinex
          cp "$(find /tmp/bepinex -type f -name BepInEx.dll -print -quit)" .ci-deps/BepInEx.dll
          cp "$(find /tmp/bepinex -type f -name 0Harmony.dll -print -quit)" .ci-deps/0Harmony.dll
          for f in assembly_valheim.dll UnityEngine.CoreModule.dll UnityEngine.AnimationModule.dll UnityEngine.dll; do
            cp "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/$f" ".ci-deps/$f"
          done
      - name: Compile BepInEx plugin net48
        run: dotnet build SirrohDegu.csproj -c Release --nologo -v minimal
      - name: Package and run static validation
        shell: bash
        run: |
          set -euo pipefail
          test -s bin/Release/net48/SirrohDegu.dll
          mkdir -p release/SirrohDegu
          cp bin/Release/net48/SirrohDegu.dll release/SirrohDegu/SirrohDegu.dll
          cp manifest.json release/SirrohDegu/manifest.json
          cp README.md release/SirrohDegu/README.md
          python3 tools/verify_build.py release/SirrohDegu/SirrohDegu.dll
          (cd release && zip -qr SirrohDegu-0.1.0.zip SirrohDegu)
      - name: Commit tested release DLL and ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/SirrohDegu-0.1.0.zip release/SirrohDegu/SirrohDegu.dll release/SirrohDegu/manifest.json release/SirrohDegu/README.md
          if ! git diff --cached --quiet; then
            git commit -m "Release Sirroh Degu 0.1.0 tested BepInEx DLL"
            git push origin HEAD:main
          fi
