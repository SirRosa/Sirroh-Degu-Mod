name: One-time Degu 0.2.4 Chat ZIP Delivery
on:
  push:
    branches: [chat-delivery-degu-024]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact release archive
        shell: bash
        run: |
          test -s release/SirRosa-SirrohDegu-0.2.4.zip
          unzip -t release/SirRosa-SirrohDegu-0.2.4.zip
      - name: Verify native Blender model
        shell: bash
        run: |
          test -s release/Degu_Wolf_Reweighted_v0.1.11.blend
          zstd -d -f release/Degu_Wolf_Reweighted_v0.1.11.blend -o Degu_Editable_Current_v0.1.11.blend
          test "$(head -c 7 Degu_Editable_Current_v0.1.11.blend)" = "BLENDER"
      - name: Deliver editable Blender model
        uses: actions/upload-artifact@v4
        with:
          name: degu-editable-blend-v0111
          path: Degu_Editable_Current_v0.1.11.blend
          retention-days: 1
          if-no-files-found: error
      - name: Make downloaded ZIP available as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: degu024-chat-download
          path: release/SirRosa-SirrohDegu-0.2.4.zip
          retention-days: 1
          if-no-files-found: error
